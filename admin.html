<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · S&amp;D · Boda 2026</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream:      #f7f5ef;
            --cream-dark: #ebe8de;
            --gold:       #6b7d3a;
            --gold-dark:  #4a5826;
            --ink:        #2d3320;
            --ink-soft:   #5e6852;
            --sage:       #8aa370;
            --mint:       #b8d4b8;
            --shadow:     0 20px 60px rgba(45, 51, 32, 0.1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            background-color: var(--cream);
            color: var(--ink);
            line-height: 1.6;
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at top left,  rgba(184, 212, 184, 0.18), transparent 55%),
                radial-gradient(ellipse at bottom right, rgba(138, 163, 112, 0.14), transparent 55%);
        }

        /* ===========================
           Pantalla de login
           =========================== */
        #loginScreen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: linear-gradient(135deg, var(--cream) 0%, var(--cream-dark) 100%);
            z-index: 100;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(107, 125, 58, 0.2);
            border-radius: 4px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .login-monogram {
            margin-bottom: 1.8rem;
            opacity: 0.9;
        }

        .login-title {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 300;
            font-size: 1.6rem;
            color: var(--ink);
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--gold);
            margin-bottom: 2rem;
        }

        .login-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(107, 125, 58, 0.25);
            border-radius: 2px;
            padding: 0.85rem 1rem;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-style: italic;
            color: var(--ink);
            text-align: center;
            letter-spacing: 0.2em;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 1rem;
        }

        .login-field:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(107, 125, 58, 0.08);
        }

        .login-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold-dark);
            padding: 0.85rem 2.2rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.35s ease;
            width: 100%;
            border-radius: 0;
        }

        .login-btn:hover {
            background: var(--gold);
            color: var(--cream);
        }

        .login-error {
            margin-top: 0.9rem;
            font-size: 0.78rem;
            color: #9b4343;
            letter-spacing: 0.02em;
            min-height: 1.2em;
        }

        /* ===========================
           Dashboard
           =========================== */
        #dashboard { display: none; }

        .admin-header {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(107, 125, 58, 0.15);
            padding: 0 2rem;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .header-brand-text {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.1rem;
            color: var(--ink);
        }

        .header-brand-text span {
            font-size: 0.65rem;
            font-style: normal;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--ink-soft);
            display: block;
            margin-top: -2px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(107, 125, 58, 0.4);
            color: var(--ink-soft);
            padding: 0.45rem 1.1rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 0;
        }

        .btn-outline:hover {
            border-color: var(--gold);
            color: var(--gold-dark);
        }

        .admin-main {
            max-width: 1140px;
            margin: 0 auto;
            padding: 2.5rem 2rem 4rem;
        }

        .admin-page-title {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 300;
            font-size: clamp(1.6rem, 3vw, 2.2rem);
            color: var(--ink);
            margin-bottom: 0.4rem;
        }

        .admin-page-sub {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.35em;
            color: var(--gold);
            margin-bottom: 2rem;
        }

        /* Summary cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            max-width: 500px;
            margin-bottom: 2.5rem;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(107, 125, 58, 0.18);
            border-radius: 2px;
            padding: 1.6rem 1.5rem;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .summary-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(107, 125, 58, 0.1);
        }

        .summary-num {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: 3rem;
            color: var(--gold);
            line-height: 1;
            margin-bottom: 0.4rem;
        }

        .summary-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--ink-soft);
        }

        /* Table section */
        .table-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .table-section-title {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.3rem;
            color: var(--ink);
            font-weight: 300;
        }

        .table-actions {
            display: flex;
            gap: 0.6rem;
        }

        .btn-primary {
            background: var(--gold);
            border: 1px solid var(--gold);
            color: var(--cream);
            padding: 0.5rem 1.3rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 0;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary:hover {
            background: var(--gold-dark);
            border-color: var(--gold-dark);
        }

        .table-wrapper {
            overflow-x: auto;
            border: 1px solid rgba(107, 125, 58, 0.15);
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.45);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        thead tr {
            background: rgba(107, 125, 58, 0.08);
            border-bottom: 1px solid rgba(107, 125, 58, 0.18);
        }

        th {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.62rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--gold-dark);
            padding: 0.9rem 1rem;
            text-align: left;
            white-space: nowrap;
        }

        th.col-center { text-align: center; }

        td {
            padding: 0.75rem 1rem;
            color: var(--ink);
            border-bottom: 1px solid rgba(107, 125, 58, 0.06);
            vertical-align: top;
            line-height: 1.5;
        }

        .row-odd { background: rgba(255, 255, 255, 0.3); }
        .row-even { background: transparent; }

        .cell-nombre { font-weight: 400; white-space: nowrap; }
        .cell-center { text-align: center; }
        .cell-bold   { font-weight: 500; text-align: center; color: var(--gold-dark); }
        .cell-empty  { color: var(--ink-soft); opacity: 0.4; }
        .cell-date   { white-space: nowrap; font-size: 0.8rem; color: var(--ink-soft); }
        .cell-mensaje { max-width: 240px; }

        .table-state-cell {
            text-align: center;
            padding: 2.5rem;
            color: var(--ink-soft);
            font-style: italic;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
        }

        .table-error { color: #9b4343; }

        /* Responsive */
        @media (max-width: 600px) {
            .admin-header { padding: 0 1rem; }
            .admin-main   { padding: 1.5rem 1rem 3rem; }
            .summary-grid { max-width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Pantalla de login -->
    <div id="loginScreen">
        <div class="login-box">
            <div class="login-monogram">
                <svg viewBox="0 0 100 100" width="64">
                    <circle cx="50" cy="50" r="40" stroke="#6b7d3a" stroke-width="0.7" fill="none"/>
                    <text x="50" y="59" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="28" font-style="italic" fill="#6b7d3a">S&amp;D</text>
                </svg>
            </div>
            <h1 class="login-title">Panel de administración</h1>
            <p class="login-subtitle">Boda García · López · 2026</p>

            <input
                type="password"
                id="adminPassword"
                class="login-field"
                placeholder="Contraseña"
                autocomplete="current-password">
            <button id="loginBtn" class="login-btn">Ingresar</button>
            <p id="loginError" class="login-error"></p>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard">

        <header class="admin-header">
            <div class="header-brand">
                <svg viewBox="0 0 100 100" width="36">
                    <circle cx="50" cy="50" r="40" stroke="#6b7d3a" stroke-width="0.7" fill="none"/>
                    <text x="50" y="59" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="28" font-style="italic" fill="#6b7d3a">S&amp;D</text>
                </svg>
                <div class="header-brand-text">
                    Santiago &amp; Daniela
                    <span>Administración</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="reloadBtn" class="btn-outline">
                    Recargar
                </button>
                <button id="logoutBtn" class="btn-outline">
                    Cerrar sesión
                </button>
            </div>
        </header>

        <main class="admin-main">
            <h1 class="admin-page-title">Confirmaciones de asistencia</h1>
            <p class="admin-page-sub">RSVP · Boda 04.07.2026</p>

            <div class="summary-grid">
                <div class="summary-card">
                    <div class="summary-num" id="totalRsvps">—</div>
                    <div class="summary-label">Respuestas recibidas</div>
                </div>
                <div class="summary-card">
                    <div class="summary-num" id="totalPersonas">—</div>
                    <div class="summary-label">Personas confirmadas</div>
                </div>
            </div>

            <div class="table-header">
                <h2 class="table-section-title">Todas las respuestas</h2>
                <div class="table-actions">
                    <button id="exportBtn" class="btn-primary">
                        <svg viewBox="0 0 24 24" width="13" height="13"><path d="M12 3v13M5 15l7 7 7-7M3 19h18" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        Exportar CSV
                    </button>
                </div>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th class="col-center">Acompañantes</th>
                            <th class="col-center">Total</th>
                            <th>Restricciones / Alergias</th>
                            <th>Canción</th>
                            <th>Mensaje</th>
                            <th>Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="rsvpTableBody">
                        <tr>
                            <td colspan="7" class="table-state-cell">Cargando…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="admin.js"></script>
</body>
</html>
